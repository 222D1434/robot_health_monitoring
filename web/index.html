<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Health Monitor - TurtleBot3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/roslib/build/roslib.min.js"></script>
    <style>
        .status-ok { background-color: #10b981; }
        .status-warn { background-color: #f59e0b; }
        .status-error { background-color: #ef4444; }
        .status-stale { background-color: #6b7280; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">

    <div class="max-w-6xl mx-auto">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl font-bold">🤖 Robot Health Monitor</h1>
            <div id="connection-status" class="flex items-center gap-2">
                <span id="conn-dot" class="w-3 h-3 rounded-full bg-red-500 pulse"></span>
                <span id="conn-text" class="text-sm text-gray-400">Desconectado</span>
            </div>
        </div>

        <div id="global-status" class="mb-8 p-6 rounded-xl bg-gray-800 border border-gray-700">
            <h2 class="text-lg font-semibold mb-2">Estado Global</h2>
            <div class="flex items-center gap-3">
                <span id="global-dot" class="w-5 h-5 rounded-full status-stale"></span>
                <span id="global-label" class="text-xl font-bold">Esperando datos...</span>
            </div>
            <p id="global-timestamp" class="text-sm text-gray-500 mt-2"></p>
        </div>

        <h2 class="text-lg font-semibold mb-4">Subsistemas</h2>
        <div id="subsystems-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
        </div>

        <h2 class="text-lg font-semibold mb-4">Componentes</h2>
        <div id="components-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        </div>

        <div id="help-box" class="mt-8 p-4 rounded-lg bg-gray-800 border border-gray-700 text-sm text-gray-400">
            <p><strong>Conexión:</strong> Esta página se conecta automáticamente al robot vía WebSocket (puerto 9090).</p>
            <p class="mt-1">Si no se conecta, verifica que <code>rosbridge_websocket</code> esté corriendo en el robot.</p>
        </div>
    </div>

    <script>
        const ROBOT_IP = window.location.hostname || '192.168.1.100';
        const ROSBRIDGE_PORT = 9090;

        const ros = new ROSLIB.Ros();

        function connect() {
            ros.connect(`ws://${ROBOT_IP}:${ROSBRIDGE_PORT}`);
        }

        ros.on('connection', () => {
            document.getElementById('conn-dot').className = 'w-3 h-3 rounded-full bg-green-500';
            document.getElementById('conn-text').textContent = 'Conectado';
            document.getElementById('help-box').style.display = 'none';
        });

        ros.on('close', () => {
            document.getElementById('conn-dot').className = 'w-3 h-3 rounded-full bg-red-500 pulse';
            document.getElementById('conn-text').textContent = 'Desconectado';
            document.getElementById('help-box').style.display = 'block';
            setTimeout(connect, 3000);
        });

        ros.on('error', (err) => {
            console.error('Error de rosbridge:', err);
        });

        const healthTopic = new ROSLIB.Topic({
            ros: ros,
            name: '/health_status_json',
            messageType: 'std_msgs/msg/String'
        });

        healthTopic.subscribe((msg) => {
            try {
                const data = JSON.parse(msg.data);
                updateDashboard(data);
            } catch (e) {
                console.error('Error parseando JSON:', e);
            }
        });

        function getStatusClassFromText(level) {
            switch (String(level).toUpperCase()) {
                case 'OK': return 'status-ok';
                case 'WARN': return 'status-warn';
                case 'ERROR': return 'status-error';
                default: return 'status-stale';
            }
        }

        function updateDashboard(data) {
            const globalStatus = String(data.global_status || 'STALE').toUpperCase();
            document.getElementById('global-dot').className = `w-5 h-5 rounded-full ${getStatusClassFromText(globalStatus)}`;
            document.getElementById('global-label').textContent = globalStatus;
            document.getElementById('global-timestamp').textContent = `Última actualización: ${new Date().toLocaleTimeString()}`;

            const subsystemsGrid = document.getElementById('subsystems-grid');
            subsystemsGrid.innerHTML = '';

            const subsystems = data.subsystems || {};
            Object.entries(subsystems).forEach(([name, level]) => {
                const card = document.createElement('div');
                card.className = 'p-4 rounded-lg bg-gray-800 border border-gray-700';
                card.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full ${getStatusClassFromText(level)}"></span>
                        <span class="font-semibold">${name}</span>
                    </div>
                `;
                subsystemsGrid.appendChild(card);
            });

            const componentsGrid = document.getElementById('components-grid');
            componentsGrid.innerHTML = '';

            const components = data.components || {};
            Object.entries(components).forEach(([name, info]) => {
                const level = info.level || 'STALE';
                const message = info.message || '';

                const card = document.createElement('div');
                card.className = 'p-4 rounded-lg bg-gray-800 border border-gray-700';
                card.innerHTML = `
                    <div class="flex items-center gap-2 mb-2">
                        <span class="w-3 h-3 rounded-full ${getStatusClassFromText(level)}"></span>
                        <span class="font-semibold break-all">${name}</span>
                    </div>
                    <p class="text-sm text-gray-400">${message}</p>
                `;
                componentsGrid.appendChild(card);
            });
        }

        connect();
    </script>
</body>
</html>
