<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Health Monitor - TurtleBot3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/roslib/build/roslib.min.js"></script>
    <style>
        .status-ok { background-color: #10b981; }
        .status-warn { background-color: #f59e0b; }
        .status-error { background-color: #ef4444; }
        .status-stale { background-color: #6b7280; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">

    <!-- Header -->
    <div class="max-w-5xl mx-auto">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl font-bold">🤖 Robot Health Monitor</h1>
            <div id="connection-status" class="flex items-center gap-2">
                <span id="conn-dot" class="w-3 h-3 rounded-full bg-red-500 pulse"></span>
                <span id="conn-text" class="text-sm text-gray-400">Desconectado</span>
            </div>
        </div>

        <!-- Global Status -->
        <div id="global-status" class="mb-8 p-6 rounded-xl bg-gray-800 border border-gray-700">
            <h2 class="text-lg font-semibold mb-2">Estado Global</h2>
            <div class="flex items-center gap-3">
                <span id="global-dot" class="w-5 h-5 rounded-full status-stale"></span>
                <span id="global-label" class="text-xl font-bold">Esperando datos...</span>
            </div>
            <p id="global-timestamp" class="text-sm text-gray-500 mt-2"></p>
        </div>

        <!-- Subsystems Grid -->
        <h2 class="text-lg font-semibold mb-4">Subsistemas</h2>
        <div id="subsystems-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Se llenan dinámicamente -->
        </div>

        <!-- Instrucciones de conexión -->
        <div id="help-box" class="mt-8 p-4 rounded-lg bg-gray-800 border border-gray-700 text-sm text-gray-400">
            <p><strong>Conexión:</strong> Esta página se conecta automáticamente al robot vía WebSocket (puerto 9090).</p>
            <p class="mt-1">Si no se conecta, verifica que <code>rosbridge_websocket</code> esté corriendo en el robot.</p>
        </div>
    </div>

    <script>
        // ─── CONFIGURACIÓN ───────────────────────────────────────────────
        // Cambia esta IP por la de tu Raspberry Pi en la red
        const ROBOT_IP = window.location.hostname || '192.168.129.74';
        const ROSBRIDGE_PORT = 9090;

        // ─── CONEXIÓN ROS ────────────────────────────────────────────────
        const ros = new ROSLIB.Ros();

        function connect() {
            ros.connect(`ws://${ROBOT_IP}:${ROSBRIDGE_PORT}`);
        }

        ros.on('connection', () => {
            document.getElementById('conn-dot').className = 'w-3 h-3 rounded-full bg-green-500';
            document.getElementById('conn-text').textContent = 'Conectado';
            document.getElementById('help-box').style.display = 'none';
        });

        ros.on('close', () => {
            document.getElementById('conn-dot').className = 'w-3 h-3 rounded-full bg-red-500 pulse';
            document.getElementById('conn-text').textContent = 'Desconectado';
            document.getElementById('help-box').style.display = 'block';
            // Reintentar conexión cada 3 segundos
            setTimeout(connect, 3000);
        });

        ros.on('error', (err) => {
            console.error('Error de rosbridge:', err);
        });

        // ─── SUSCRIPCIÓN AL TOPIC ────────────────────────────────────────
        const healthTopic = new ROSLIB.Topic({
            ros: ros,
            name: '/health_status_json',
            messageType: 'std_msgs/msg/String'
        });

        healthTopic.subscribe((msg) => {
            try {
                const data = JSON.parse(msg.data);
                updateDashboard(data);
            } catch (e) {
                console.error('Error parseando JSON:', e);
            }
        });

        // ─── ACTUALIZAR DASHBOARD ────────────────────────────────────────
        function getStatusClass(level) {
            switch (level) {
                case 0: return 'status-ok';
                case 1: return 'status-warn';
                case 2: return 'status-error';
                default: return 'status-stale';
            }
        }

        function getStatusLabel(level) {
            switch (level) {
                case 0: return 'OK';
                case 1: return 'WARN';
                case 2: return 'ERROR';
                default: return 'STALE';
            }
        }

        function updateDashboard(data) {
            // Estado global
            const globalLevel = data.global_status ?? data.level ?? 3;
            document.getElementById('global-dot').className = `w-5 h-5 rounded-full ${getStatusClass(globalLevel)}`;
            document.getElementById('global-label').textContent = getStatusLabel(globalLevel);
            document.getElementById('global-timestamp').textContent = `Última actualización: ${new Date().toLocaleTimeString()}`;

            // Subsistemas
            const grid = document.getElementById('subsystems-grid');
            const subsystems = data.subsystems || data.status || [];

            if (subsystems.length === 0 && data.diagnostics) {
                // Formato alternativo
                renderSubsystems(grid, data.diagnostics);
            } else {
                renderSubsystems(grid, subsystems);
            }
        }

        function renderSubsystems(grid, subsystems) {
            grid.innerHTML = '';

            subsystems.forEach(sub => {
                const name = sub.name || sub.hardware_id || 'Desconocido';
                const level = sub.level ?? sub.status ?? 3;
                const message = sub.message || '';
                const values = sub.values || sub.key_values || [];

                const card = document.createElement('div');
                card.className = 'p-4 rounded-lg bg-gray-800 border border-gray-700';
                card.innerHTML = `
                    <div class="flex items-center gap-2 mb-2">
                        <span class="w-3 h-3 rounded-full ${getStatusClass(level)}"></span>
                        <span class="font-semibold">${name}</span>
                    </div>
                    <p class="text-sm text-gray-400 mb-2">${message}</p>
                    <div class="text-xs text-gray-500">
                        ${values.map(v => `<div>${v.key || v.label}: <span class="text-gray-300">${v.value}</span></div>`).join('')}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ─── INICIAR CONEXIÓN ────────────────────────────────────────────
        connect();
    </script>
</body>
</html>
